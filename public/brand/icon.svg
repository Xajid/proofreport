<svg width="64" height="64" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pr-brand-primary" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="pr-check-highlight" x1="12" y1="14" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="pr-shadow" x="0" y="2" width="40" height="38" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0d9488" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded container squircle -->
  <rect x="3" y="3" width="34" height="34" rx="10" fill="url(#pr-brand-primary)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />

  <!-- Background layer: stacked report sheet fold -->
  <path d="M22 10.5H15.5C14.12 10.5 13 11.62 13 13V27C13 28.38 14.12 29.5 15.5 29.5H24.5C25.88 29.5 27 28.38 27 27V15.5L22 10.5Z" fill="white" fill-opacity="0.08" />

  <!-- Stem of the 'P' (vertical anchor bar) -->
  <rect x="13" y="12" width="3.5" height="16" rx="1.75" fill="white" />

  <!-- Dynamic 'P' loop that morphs into a proof checkmark -->
  <path d="M14.5 12H21.5C24.54 12 27 14.24 27 17C27 19.76 24.54 22 21.5 22H14.5" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Embedded proof verification checkmark accent -->
  <path d="M17.5 17L20 19.5L25 14" stroke="url(#pr-check-highlight)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#pr-shadow)" />
</svg>
